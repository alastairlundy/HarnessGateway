name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish binary (${{ matrix.runtime }})
        run: >
          dotnet publish src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained
          -o publish/${{ matrix.runtime }}

      - name: Package binary
        shell: bash
        run: |
          cd publish/${{ matrix.runtime }}
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            7z a ../harnessgateway-${{ matrix.runtime }}.zip .
          else
            cd ../
            tar -czf harnessgateway-${{ matrix.runtime }}.tar.gz -C ${{ matrix.runtime }} .
          fi

      - name: Verify binary archive
        shell: bash
        run: |
          set -euo pipefail
          root=harnessgateway
          rid="${{ matrix.runtime }}"
          if [[ "$rid" == win-* ]]; then
            ext=zip
          else
            ext=tar.gz
          fi
          archive="publish/${root}-${rid}.${ext}"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Expected ${archive}: archive prefix must equal the binary name '${root}' (see T003 artifact contract)"
            exit 1
          fi
          echo "Verified ${archive}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harnessgateway-${{ matrix.runtime }}
          path: publish/harnessgateway-${{ matrix.runtime }}.*

  release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(artifacts/*.zip)
          tarballs=(artifacts/*.tar.gz)
          if [[ ${#zips[@]} -lt 1 || ${#tarballs[@]} -lt 1 ]]; then
            echo "::error::Release needs both artifact kinds (T003): ${#zips[@]} zip, ${#tarballs[@]} tar.gz"
            ls -la artifacts
            exit 1
          fi
          echo "Verified ${#zips[@]} zip archive(s), ${#tarballs[@]} tar.gz archive(s)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
