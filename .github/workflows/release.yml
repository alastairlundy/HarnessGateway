name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish binary (${{ matrix.runtime }})
        run: >
          dotnet publish src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained
          -o publish/${{ matrix.runtime }}

      - name: Package binary
        shell: bash
        run: |
          cd publish/${{ matrix.runtime }}
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            7z a ../harnessgateway-${{ matrix.runtime }}.zip .
          else
            cd ../
            tar -czf harnessgateway-${{ matrix.runtime }}.tar.gz -C ${{ matrix.runtime }} .
          fi

      - name: Verify binary archive
        shell: bash
        run: |
          set -euo pipefail
          csproj=src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj
          root="$(dotnet msbuild "$csproj" -getProperty:PackageId -nologo)"
          rid="${{ matrix.runtime }}"
          if [[ "$rid" == win-* ]]; then
            ext=zip
          else
            ext=tar.gz
          fi
          archive="publish/${root}-${rid}.${ext}"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Expected ${archive}: archive prefix must equal PackageId '${root}' (see T003 artifact contract)"
            exit 1
          fi
          echo "Verified ${archive}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harnessgateway-${{ matrix.runtime }}
          path: publish/harnessgateway-${{ matrix.runtime }}.*

  build-nuget:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate tool package ID
        shell: bash
        run: |
          set -euo pipefail
          csproj=src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj
          package_id="$(dotnet msbuild "$csproj" -getProperty:PackageId -nologo)"
          tool_command="$(dotnet msbuild "$csproj" -getProperty:ToolCommandName -nologo)"
          pack_as_tool="$(dotnet msbuild "$csproj" -getProperty:PackAsTool -nologo)"
          # Working root name (D017): tool ID and binary archive prefix track it until the rename.
          expected=harnessgateway
          if [[ "$package_id" != "$expected" || "$tool_command" != "$expected" || "$pack_as_tool" != "true" ]]; then
            echo "::error::Tool ID drift: PackageId='${package_id}', ToolCommandName='${tool_command}', PackAsTool='${pack_as_tool}'; expected '${expected}'/true. Rename is an explicit change (D017) - update workflow and README rows together."
            exit 1
          fi
          echo "Verified tool package ID '${package_id}' (command '${tool_command}')"

      - name: Pack NuGet tool
        run: dotnet pack src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj -c Release -o artifacts

      - name: Verify tool package artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/harnessgateway.*.nupkg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one artifacts/harnessgateway.*.nupkg, found ${#packages[@]}"
            exit 1
          fi
          echo "Verified ${packages[0]}"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: harnessgateway-nuget
          path: artifacts/*.nupkg

  release:
    needs: [build-binaries, build-nuget]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          zips=(artifacts/*.zip)
          tarballs=(artifacts/*.tar.gz)
          if [[ ${#packages[@]} -lt 1 || ${#zips[@]} -lt 1 || ${#tarballs[@]} -lt 1 ]]; then
            echo "::error::Release needs both artifact kinds (T003): ${#packages[@]} tool package(s), ${#zips[@]} zip, ${#tarballs[@]} tar.gz"
            ls -la artifacts
            exit 1
          fi
          echo "Verified ${#packages[@]} tool package(s), ${#zips[@]} zip archive(s), ${#tarballs[@]} tar.gz archive(s)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
