# dotnet-releaser configuration for HarnessGateway.
#
# Every value that affects produced artifacts or publish behavior is set
# explicitly here - nothing is left at a tool default.
# GitHub release state (draft creation, asset upload, publication) is owned by
# .github/workflows/publish-release.yml via the gh CLI and GITHUB_TOKEN only.
# This tool itself never creates, edits, or publishes a release, and never
# writes to any GitHub repository other than this one.
#
# SCOPE: Linux only. Native AOT cannot cross-compile across operating systems,
# so the release pipeline in publish-release.yml runs one build job per OS.
# Windows and macOS publish their own RIDs directly (dotnet publish +
# version-less zip/tar.gz archives, named by the workflow scripts); this file
# feeds only the ubuntu job, which produces the Linux tar.gz archives plus the
# unsigned deb/rpm packages. The former all-RID configuration was replaced when
# the release shape moved to Native AOT.

# Use only the [[pack]] block below as the artifact matrix; the tool's default
# profiles (and their extra RIDs/kinds) must not add anything implicitly.
profile = "custom"

# Where built packages land (also the folder the workflow uploads/verifies).
artifacts_folder = "artifacts-dotnet-releaser"

# Draft releases carry hand-written notes - generated changelogs are disabled.
# The binaries are never uploaded to a draft by this tool: publish-release.yml
# attaches the built binaries to the draft only when the maintainer dispatches it.
enable_publish_packages_in_draft = false

[msbuild]
# The projects are listed individually rather than as HarnessGateway.slnx:
# dotnet-releaser probes every project it finds in a solution (injecting its
# DotNetReleaserGetPackageInfo MSBuild target, which depends on GetAssemblyVersion
# and parses OutputType) and that probe cannot digest a WiX SDK project - the
# wixproj defines neither target shape (MSB4057 on GetAssemblyVersion; OutputType
# "Package" is not a value it understands). The installers do not belong to this
# build anyway: the MSIs are produced by publish-release.yml's windows-only job.
# The three .csproj entries keep the Launcher, its Core library (skipped by app
# packaging - it is a Library) and the TUnit test project in the build and tests.
project = [
  "src/HarnessGateway.Launcher/HarnessGateway.Launcher.csproj",
  "src/HarnessGateway.Launcher.Core/HarnessGateway.Launcher.Core.csproj",
  "src/HarnessGateway.Launcher.Tests/HarnessGateway.Launcher.Tests.csproj",
]
configuration = "Release"
configuration_debug = "Debug"
build_debug = false
# Load and build the projects above (explicit; not a tool default).
publish = true

[msbuild.properties]
# Publish shape for the Linux RIDs: Native AOT. The ubuntu job installs the
# cross toolchain (clang/llvm, arm64 binutils/gcc, arm64 zlib via multiarch)
# that cross-compiling linux-arm64 on an x64 runner requires - see
# https://learn.microsoft.com/dotnet/core/deploying/native-aot/cross-compile .
# AOT output is inherently self-contained and a single native binary, so the
# single-file and ReadyToRun switches are pinned off for clarity. PublishTrimmed
# must NOT be set at all alongside PublishAot: the SDK errors that trimming is
# implied by native compilation and cannot be disabled. Note the shape matters
# at restore time too: the ILCompiler runtime pack only reaches the assets file
# through a restore that saw these properties.
SelfContained = true
PublishAot = true
PublishSingleFile = false
PublishReadyToRun = false
CopyOutputSymbolsToPublishDirectory = false
SkipCopyingSymbolsToOutputDirectory = true

[test]
# Tests run as part of the ubuntu release build, making it the tagged commit's
# test gate in the release path (ci.yml covers every PR/push to main).
enable = true
run_tests = true
run_tests_for_debug = false

[coverage]
# No code-coverage tooling in the CI gate or the release pipeline, and no
# Coveralls upload anywhere (never adopted; the service integration was removed
# upstream in dotnet-releaser 0.14.0). Nothing coverage-related leaves this repo.
enable = false

[github]
user = "alastairlundy"
repo = "HarnessGateway"
base = "https://github.com"
api = "https://api.github.com"
# No version prefix: tags are unprefixed (0.1.0) and equal the csproj <Version>.
# The publish workflow asserts the tag matches that pinned version.
version_prefix = ""
branches = ["main"]
# dotnet-releaser itself is never allowed to publish to GitHub. The release
# workflow owns the draft/publish lifecycle, and no release step in this repo
# can create or write to any GitHub repository other than this one.
publish = false

[changelog]
# Generated changelogs are deliberately off. Release notes are written by hand
# when the maintainer creates the draft release - see
# docs/release/winget-manifest.md - so nothing is generated from PRs or commits
# and no changelog is uploaded. `publish = false` disables the feature entirely;
# no build-time draft is created either.
publish = false
disable_draft_for_build = true

[nuget]
# NuGet is a standing refusal: no .nupkg is produced and nothing is pushed to
# any NuGet feed - publish = false disables pack output as well as upload
# (docs/agents/out-of-scope.md).
publish = false
publish_draft = false
trusted_publishing = false
source = "https://api.nuget.org/v3/index.json"

[brew]
# Homebrew publishing is disabled, including the Brew.Home auto-tap-repository
# creation (NewRepository with AutoInit) - no second repository is ever created
# macOS users install from the tar.gz archives.
publish = false

[scoop]
# Scoop bucket publishing is disabled for the same reason: no repository
# creation, no manifest upload. Windows users install from the zip
# archives.
publish = false

[service]
# No systemd unit is packaged into the .deb/.rpm artifacts (native
# service/installer packaging is deferred; these are plain binary packages).
publish = false

# ---------------------------------------------------------------------------
# Artifact matrix - the complete set of produced files.
#
# Linux archives: tar.gz, version-less and named `harnessgateway-<rid>.tar.gz`
# so the archive prefix equals the binary name (AssemblyName `harnessgateway`).
# dotnet-releaser derives the default archive name from PackageId, which is
# capitalized (`HarnessGateway`), so the renamer must match case-insensitively;
# the replacement keeps the lowercase shape. The renamer strips the default
# `harnessgateway.<version>.` segment from every archive file name (deb/rpm are
# already emitted without a version segment and never match).
#
# The windows zip and macOS tar.gz archives are NOT produced here: the
# windows/macos jobs in publish-release.yml name them
# `harnessgateway-<rid>.zip|.tar.gz` directly.
# ---------------------------------------------------------------------------

[[pack]]
# .deb (Debian/Ubuntu) and .rpm (Fedora/RHEL) ship UNSIGNED - signing is
# refused outright, no GPG key material exists in this pipeline.
publish = true
rid = ["linux-x64", "linux-arm64"]
kinds = ["tar", "deb", "rpm"]
renamer = [{ pattern = '(?i)^harnessgateway\.\d+(\.\d+)+(-[\w.-]+)?\.', replace = 'harnessgateway-' }]
